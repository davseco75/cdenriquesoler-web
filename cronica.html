<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.className+=' js';</script>
<title>Crónica del partido | CD Enrique Soler</title>
<meta name="description" content="Crónica, resultado por cuartos y destacados del partido del CD Enrique Soler en la Tercera FEB Grupo D-A.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="CD Enrique Soler">
<meta property="og:title" id="ogTitle" content="Crónica del partido · CD Enrique Soler">
<meta property="og:image" content="https://cdenriquesoler.com/galeria/foto-primer-equipo.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jugador.css">
<style>
  .cr-wrap{max-width:820px;margin:0 auto;padding:110px 5% 70px;}
  .cr-jor{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--o);}
  .cr-tit{font-family:'Bebas Neue';font-size:clamp(34px,6vw,64px);line-height:.95;margin:10px 0 6px;}
  .cr-fecha{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:26px;}
  .cr-marcador{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
    background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;margin-bottom:8px;}
  .cr-eq{font-family:'Bebas Neue';font-size:clamp(18px,3vw,26px);line-height:1.05;}
  .cr-eq.der{text-align:right;}
  .cr-res{font-family:'Bebas Neue';font-size:clamp(30px,6vw,50px);color:var(--o);white-space:nowrap;}
  .cr-gano .cr-res{color:#4ade80;}
  .cr-cuartos{display:flex;gap:6px;margin-bottom:26px;flex-wrap:wrap;}
  .cr-q{flex:1;min-width:64px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
    border-radius:8px;padding:8px;text-align:center;}
  .cr-q b{display:block;font-family:'Bebas Neue';font-size:18px;color:#fff;}
  .cr-q span{font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.35);text-transform:uppercase;}
  .cr-entradilla{font-size:clamp(18px,2.4vw,23px);line-height:1.45;font-weight:600;margin-bottom:24px;}
  .cr-cuerpo p{font-size:16px;line-height:1.8;color:rgba(255,255,255,.7);margin-bottom:20px;}
  .cr-dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:8px 0 34px;}
  .cr-d{background:rgba(255,107,43,.05);border:1px solid rgba(255,107,43,.16);border-radius:12px;padding:14px 16px;}
  .cr-d b{display:block;font-size:15px;color:#fff;margin-bottom:3px;}
  .cr-d span{font-size:13px;color:var(--o3,#FF9A6C);}
  .cr-vacio{text-align:center;padding:70px 20px;color:rgba(255,255,255,.45);}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="logo.png" alt="CD Enrique Soler">
    <span>ENRIQUE SOLER<em>Melilla Ciudad del Deporte</em></span>
  </a>
  <a class="nav-back" href="primer-equipo.html#noticias">← Primer Equipo</a>
</nav>

<main id="contenido">
  <article class="cr-wrap" id="cr"></article>
</main>

<div class="prensa">
  Club Deportivo Enrique Soler · Melilla ·
  <a href="mailto:enriquesolergerencia@gmail.com">enriquesolergerencia@gmail.com</a>
</div>

<script>
/* Crónica de partido: se elige con ?id= y se lee de data/cronicas.json.
   Añadir una crónica nueva = añadir un objeto a ese JSON. */
(function(){
  var cont=document.getElementById('cr');
  var id=new URLSearchParams(location.search).get('id');
  fetch('/data/cronicas.json').then(function(r){return r.json();}).then(function(d){
    var lista=(d.cronicas||[]).filter(function(c){return !c.borrador;});
    var c = id ? lista.filter(function(x){return x.id===id;})[0] : lista[lista.length-1];
    if(!c){ cont.innerHTML='<div class="cr-vacio">Todavía no hay crónicas publicadas.<br>'
      +'<a href="primer-equipo.html#resultados" style="color:var(--o)">Ver el calendario →</a></div>'; return; }

    var casa=/Enrique Soler/i.test(c.local);
    var r=(c.resultado||'').split('-').map(Number);
    var gano = r.length===2 && (casa ? r[0]>r[1] : r[1]>r[0]);
    document.title=c.titular+' | CD Enrique Soler';
    var og=document.getElementById('ogTitle'); if(og) og.content=c.titular+' · CD Enrique Soler';

    cont.innerHTML =
      '<div class="cr-jor">Jornada '+c.jornada+' · Tercera FEB Grupo D-A</div>'
      +'<h1 class="cr-tit">'+c.titular+'</h1>'
      +'<div class="cr-fecha">'+c.fecha+(c.pabellon?' · '+c.pabellon:'')+'</div>'
      +'<div class="cr-marcador'+(gano?' cr-gano':'')+'">'
        +'<div class="cr-eq">'+c.local+'</div>'
        +'<div class="cr-res">'+(c.resultado||'—')+'</div>'
        +'<div class="cr-eq der">'+c.visitante+'</div>'
      +'</div>'
      +(c.cuartos&&c.cuartos.length ? '<div class="cr-cuartos">'+c.cuartos.map(function(q,i){
          return '<div class="cr-q"><b>'+q+'</b><span>C'+(i+1)+'</span></div>';}).join('')+'</div>' : '')
      +(c.entradilla?'<p class="cr-entradilla">'+c.entradilla+'</p>':'')
      +(c.destacados&&c.destacados.length ? '<div class="cr-dest">'+c.destacados.map(function(x){
          return '<div class="cr-d"><b>'+x.jugador+'</b><span>'+x.linea+'</span></div>';}).join('')+'</div>' : '')
      +'<div class="cr-cuerpo">'+(c.cuerpo||[]).map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>'
      +'<p><a href="primer-equipo.html#resultados" style="color:var(--o);font-weight:700">← Todos los partidos</a></p>';
  }).catch(function(){
    cont.innerHTML='<div class="cr-vacio">No se ha podido cargar la crónica.</div>';
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
}
</script>
</body>
</html>
